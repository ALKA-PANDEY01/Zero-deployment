
services:
  app_v1:
    build:
      context: ./app
    image: zero-downtime-demo:local
    container_name: zerodown-app-v1
    environment:
      APP_VERSION: v1
    networks:
      - deployment
    restart: unless-stopped

  app_v2:
    build:
      context: ./app
    image: zero-downtime-demo:local
    container_name: zerodown-app-v2
    environment:
      APP_VERSION: v2
    networks:
      - deployment
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    container_name: zerodown-proxy
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app_v1
      - app_v2
    networks:
      - deployment
    restart: unless-stopped

  controller:
    build:
      context: .
      dockerfile: controller.Dockerfile

    container_name: zerodown-controller

    ports:
      - "9000:9000"

    environment:
      CONFIG: /shared/nginx.conf
      PROXY_CONTAINER: zerodown-proxy
      GATEWAY_URL: http://proxy
      ZERODOWN_CONFIG: /controller/config/zerodown.yaml
      ZERODOWN_PROJECT_ROOT: /workspace
      ZERODOWN_DOCKER_NETWORK: zerodown
      RISK_TELEMETRY_PATH: /data/risk-telemetry.jsonl

    volumes:
      - .:/workspace:ro
      - ./proxy/nginx.conf:/shared/nginx.conf
      - ./config/zerodown.yaml:/controller/config/zerodown.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data

    depends_on:
      - proxy
      - app_v1
      - app_v2

    networks:
      - deployment

    restart: unless-stopped

networks:
  deployment:
    name: zerodown
    driver: bridge
