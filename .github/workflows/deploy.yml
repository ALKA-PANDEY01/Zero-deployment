name: Zero Downtime Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build V1
        run: docker compose build app_v1

      - name: Build V2
        run: docker compose build app_v2

      - name: Deployment validation successful
        run: |
          echo "================================"
          echo " ZERO-DOWNTIME CI/CD PIPELINE"
          echo "================================"
          echo "Compose validation: PASS"
          echo "V1 build: PASS"
          echo "V2 build: PASS"
          echo "Pipeline validation: PASS"